name: Deploy Algofort to configured cPanel host
on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployment configuration
        env:
          SSH_KEY: ${{ secrets.NAMECHEAP_SSH_KEY }}
          HOST: ${{ secrets.NAMECHEAP_HOST }}
          USERNAME: ${{ secrets.CPANEL_USERNAME }}
        run: |
          test -n "$SSH_KEY" && test -n "$HOST" && test -n "$USERNAME" || { echo 'Configure cPanel deployment secrets before deploying.'; exit 1; }
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm ci

      - name: Build Production Standalone
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://algofort.com' }}
          NEXT_PUBLIC_SITE_INDEXABLE: ${{ vars.NEXT_PUBLIC_SITE_INDEXABLE || 'true' }}
          NEXT_PUBLIC_FIREBASE_API_KEY: AIzaSyBEsRew4ITMYgLFBBvvz42EKpggf36U0Gk
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: algofort-f0745.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: algofort-f0745
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: algofort-f0745.firebasestorage.app
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "767688399013"
          NEXT_PUBLIC_FIREBASE_APP_ID: 1:767688399013:web:5719eaadc9f493a8b5554c
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: G-J50TVL2GF1
          NEXT_PUBLIC_RECAPTCHA_SITE_KEY: 6LeRMfItAAAAAE6Ab634ch6gXJcLzte0dPix5kXO
          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: vfsp1egd
        run: npm run build

      - name: Prepare Standalone Release
        run: |
          mkdir -p release
          cp -r .next/standalone/. release/
          mkdir -p release/.next/static
          cp -r .next/static/. release/.next/static/
          cp -r public release/public
          mkdir -p release/tmp
          touch release/tmp/restart.txt

      - name: Setup SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.NAMECHEAP_SSH_KEY }}

      - name: Deploy to cPanel algofort directory
        run: |
          rsync -avz \
            --exclude '.env*' \
            --delete \
            -e "ssh -p 22 -o StrictHostKeyChecking=no" \
            ./release/ ${{ secrets.CPANEL_USERNAME }}@${{ secrets.NAMECHEAP_HOST }}:/home/${{ secrets.CPANEL_USERNAME }}/algofort-app/
